<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表情編集</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <h1>表情</h1>
      <p>パーツを選択して編集。下の番号をクリックで登録、数字キーで再生。</p>
    </header>
    <div id="sketch"></div>
    <p id="status" role="status" aria-live="polite">起動しています…</p>
    <input id="settings-file" type="file" accept=".json,application/json" hidden>
    <details>
      <summary>使い方と保存について</summary>
      <p>矢印／WASD：移動、Q／E：回転、1〜7：プリセット再生。数値欄はクリック後に入力、Enterで終了します。</p>
      <p>「保存」は現在の設定をJSONへ保存。「読込」はProcessing版のJSONも選べます。登録したプリセットはページを閉じると消えるので、残したい顔はJSONへ保存してください。</p>
      <p>「録画開始」→「録画停止」→「動画保存」で顔の部分だけを動画にします。録画中はこのタブを開いたままにしてください。</p>
    </details>
    <noscript>JavaScriptを有効にしてください。</noscript>
  </main>
  <script src="vendor/p5.min.js"></script>
  <script src="helpers.js"></script>
  <script src="conf.js"></script>
  <script src="state.js"></script>
  <script src="animation.js"></script>
  <script src="drawing.js"></script>
  <script src="drawUI.js"></script>
  <script src="input.js"></script>
  <script src="files.js"></script>
  <script src="recording.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
